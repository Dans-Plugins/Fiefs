# Bundled defaults. Fiefs writes its other options (version, debugMode,
# limitLand, enableTerritoryAlerts) into plugins/Fiefs/config.yml itself on
# first run, so they are not listed here. Anything below is read from this
# file whenever the one on disk lacks it, which is how an installation that
# predates a new option still gets its default.

# Usage reporting. When the plugin is enabled, and each time one of its
# commands is used, a small event (plugin name, event name, plugin version
# or command name) is sent to the author's trace server so it is known which
# plugins are actually in use. Nothing about players or the server is
# included. Sending happens off the main thread, never blocks a tick, and is
# dropped silently if the server cannot be reached. The plugin says on every
# start whether reporting is on.
#
# To turn it off for this plugin, set enabled to false below (or run
# /fi config set usage-reporting.enabled false). To turn it off for every
# plugin on this server that reports to trace, set enabled to false in
# plugins/trace/config.yml (the first such plugin to start writes that file;
# plugins never turn it back on). The environment variables
# TRACE_USAGE_REPORTING=off and DO_NOT_TRACK=1 turn it off as well.
# Details: https://github.com/Stephenson-Software/trace#usage-reporting
usage-reporting:
  enabled: true
  endpoint: https://trace.danielstephenson.dev
  # The key identifies this plugin to the trace server, so reports are
  # attributed to Fiefs and can be revoked as a group if they are ever
  # abused. It is not a secret -- it ships in this file on every server that
  # runs the plugin -- and it cannot do anything except report as this
  # plugin. Empty means reporting is off regardless of the switch above.
  key: "EJ2ADoWpgGsJbcSPqPffP1ZC2Xm8T9ykEDD9v4yw-mE"
