name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Generates ~/.m2/settings.xml with a server whose id matches the
          # `dansplugins` repository in pom.xml, reading credentials from the
          # env vars below (set from repository secrets).
          server-id: dansplugins
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Build with Maven
        run: mvn clean package
        env:
          # Add these as repository secrets (Settings -> Secrets and variables
          # -> Actions), using the `fiefs-ci` account on repo.dansplugins.com.
          MAVEN_USERNAME: ${{ secrets.DANSPLUGINS_REPO_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.DANSPLUGINS_REPO_PASSWORD }}

      # Every Bukkit class, field and method the jar uses must exist on each Minecraft
      # version in minecraft-versions.json, and its bytecode must fit the Java each runs on.
      # See https://github.com/Dans-Plugins/release-gates#api-compatibility-check
      - name: Check Bukkit API use against every supported Minecraft version
        run: |
          curl -fsSL -o /tmp/check_api_compat.py \
            https://raw.githubusercontent.com/Dans-Plugins/release-gates/v11/gates/check_api_compat.py
          python3 /tmp/check_api_compat.py --versions minecraft-versions.json target build/libs
